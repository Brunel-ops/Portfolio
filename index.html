<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <title>Portfolio BRUNEL Matthieu</title>
        <meta name="author" content="Matthieu BRUNEL">
        <meta name="robots" content="nofollow, noarchive, nosnippet, noimageindex">
        <meta name="color-scheme" content="dark ligth">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!--
            Pour la section robots je met : 
                - nofollow pour ne pas qu'il suive les lien
                - noarchive pour ne pas utiliser la page mis en cache de que la page recharge à chaque fois
                - nosnippet pour qu'il n'y est pas avoir d'extrait qui s'affiche sur les moteur de recherche
                - noimageindex pour que les images du site ne soit pas indexé

            Pour la section viewport :
                - width=device-width sert a ce que le site preine en compte 
                    la mise à l'échelle de l'écran sur le quelle il est afficher peux importe la résolution
                - initial-scale=1 sert à mettre une mise à l'échelle initial à la pleine page 
                    sans pour autant bloquer la possibilité aux utilisateur de pouvoir zommer par la suite 
                    pour ne pas perdre en accesibilité 
        -->
    </head>
    <body>
        
        <p>Ma première partie de cours</p>
    </body>
</html>
